<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Steakhouse POS & Ordering System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased">

    <!-- Header & Navigation -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-drumstick-bite text-amber-500 text-3xl"></i>
                <h1 class="text-2xl font-bold tracking-wide">PRIME STEAKHOUSE</h1>
            </div>

            <!-- Tab Navigation -->
            <nav class="flex space-x-2 bg-gray-900 p-1 rounded-xl border border-gray-700">
                <button onclick="switchTab('menu')" id="tab-btn-menu" class="px-4 py-2 rounded-lg font-semibold bg-amber-600 text-white transition">
                    <i class="fa-solid fa-utensils mr-2"></i>Menu & Order
                </button>
                <button onclick="switchTab('queue')" id="tab-btn-queue" class="px-4 py-2 rounded-lg font-semibold text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-users-line mr-2"></i>Antrean Meja
                </button>
                <button onclick="switchTab('reservation')" id="tab-btn-reservation" class="px-4 py-2 rounded-lg font-semibold text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-calendar-check mr-2"></i>Reservasi Meja
                </button>
                <button onclick="switchTab('review')" id="tab-btn-review" class="px-4 py-2 rounded-lg font-semibold text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-star mr-2"></i>Beri Ulasan
                </button>
            </nav>

            <div class="flex items-center space-x-3">
                <!-- Tombol Dinamis Login / Dashboard Admin -->
                <div id="auth-btn-container">
                    <a href="/login.html" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg text-sm font-semibold transition text-amber-400 border border-gray-600 flex items-center">
                        <i class="fa-solid fa-lock mr-1.5"></i> Login Admin
                    </a>
                </div>

                <div class="bg-gray-700 px-3 py-1.5 rounded-lg text-sm">
                    Meja: 
                    <select id="select-meja" class="bg-gray-800 text-amber-400 font-bold px-2 py-0.5 rounded border border-gray-600 max-h-48 overflow-y-auto">
                        <!-- Meja 1-50 dimuat secara dinamis via JavaScript -->
                    </select>
                </div>
                <button onclick="toggleCartModal()" class="relative bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg font-semibold transition flex items-center">
                    <i class="fa-solid fa-cart-shopping mr-2"></i> Keranjang
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- TAB 1: KATALOG MENU & POS -->
    <div id="tab-content-menu" class="tab-content max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <aside class="md:col-span-1 bg-gray-800 p-4 rounded-xl border border-gray-700 h-fit space-y-4">
            <h2 class="text-lg font-bold border-b border-gray-700 pb-2"><i class="fa-solid fa-list mr-2 text-amber-400"></i>Kategori</h2>
            <div class="space-y-2">
                <button onclick="filterCategory('all')" class="w-full text-left px-3 py-2 rounded-lg bg-amber-600 text-white font-medium">Semua Menu</button>
                <button onclick="filterCategory('steak')" class="w-full text-left px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-medium">🥩 Steak & Grill</button>
                <button onclick="filterCategory('rice_bowl')" class="w-full text-left px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-medium">🍚 Rice Bowl & Pasta</button>
                <button onclick="filterCategory('sides')" class="w-full text-left px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-medium">🍟 Starters & Sides</button>
                <button onclick="filterCategory('desserts')" class="w-full text-left px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-medium">🍰 Desserts</button>
                <button onclick="filterCategory('drinks')" class="w-full text-left px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-medium">🍹 Drinks & Mocktails</button>
            </div>
            <input type="text" id="search-input" onkeyup="searchMenu()" placeholder="Cari menu..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
        </aside>

        <section class="md:col-span-3">
            <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </div>

    <!-- TAB 2: WAITING LIST / ANTREAN MEJA -->
    <div id="tab-content-queue" class="tab-content hidden max-w-5xl mx-auto px-4 py-8 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
                <h3 class="text-xl font-bold border-b border-gray-700 pb-2"><i class="fa-solid fa-ticket text-amber-500 mr-2"></i> Ambil Antrean Baru</h3>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nama Pelanggan</label>
                    <input type="text" id="queue-nama" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Contoh: Budi">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Jumlah Orang</label>
                    <input type="number" id="queue-jumlah" min="1" value="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor WhatsApp/HP</label>
                    <input type="text" id="queue-hp" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="08123456789">
                </div>
                <button onclick="submitQueue()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2.5 rounded-lg transition">
                    Dapatkan Nomor Antrean
                </button>
            </div>
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
                <h3 class="text-xl font-bold border-b border-gray-700 pb-2"><i class="fa-solid fa-clock text-amber-500 mr-2"></i> Daftar Antrean Aktif</h3>
                <div id="queue-list-container" class="space-y-3 max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- TAB 3: RESERVASI MEJA -->
    <div id="tab-content-reservation" class="tab-content hidden max-w-5xl mx-auto px-4 py-8 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
                <h3 class="text-xl font-bold border-b border-gray-700 pb-2"><i class="fa-solid fa-calendar-plus text-amber-500 mr-2"></i> Buat Reservasi</h3>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor Meja</label>
                    <select id="res-meja" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                        <!-- Meja 1-50 dimuat dinamis -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nama Pemesan</label>
                    <input type="text" id="res-nama" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Nama Anda">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor WhatsApp/HP</label>
                    <input type="text" id="res-hp" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="08123456789">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Tanggal Reservasi</label>
                    <input type="date" id="res-tanggal" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Jam Kedatangan</label>
                    <input type="time" id="res-jam" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Jumlah Tamu</label>
                    <input type="number" id="res-tamu" min="1" value="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <button onclick="submitReservation()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2.5 rounded-lg transition">
                    Konfirmasi Reservasi
                </button>
            </div>
            
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
                <h3 class="text-xl font-bold border-b border-gray-700 pb-2"><i class="fa-solid fa-list-check text-amber-500 mr-2"></i> Daftar Meja Terreservasi</h3>
                <div id="reservation-list-container" class="space-y-3 max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- TAB 4: ULASAN & RATING BINTANG 1-5 -->
    <div id="tab-content-review" class="tab-content hidden max-w-3xl mx-auto px-4 py-8">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
            <h3 class="text-xl font-bold border-b border-gray-700 pb-2"><i class="fa-solid fa-star text-amber-500 mr-2"></i> Berikan Ulasan Menu Steak</h3>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Pilih Menu</label>
                <select id="review-menu-id" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></select>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Nama Anda</label>
                <input type="text" id="review-nama" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Nama Anda">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Rating Bintang (1-5)</label>
                <select id="review-rating" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-amber-400 font-bold">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5) Sangat Puas</option>
                    <option value="4">⭐⭐⭐⭐ (4/5) Enak</option>
                    <option value="3">⭐⭐⭐ (3/5) Cukup</option>
                    <option value="2">⭐⭐ (2/5) Kurang</option>
                    <option value="1">⭐ (1/5) Buruk</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Ulasan / Komentar</label>
                <textarea id="review-komentar" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Dagingnya sangat empuk, sausnya gurih..."></textarea>
            </div>
            <button onclick="submitReview()" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2.5 rounded-lg transition">
                Kirim Ulasan & Rating
            </button>
        </div>
    </div>

    <!-- Modal Keranjang Checkout -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 rounded-xl border border-gray-700 w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-bold"><i class="fa-solid fa-basket-shopping text-amber-500 mr-2"></i> Detail Checkout Pesanan</h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1 space-y-3">
                <div id="cart-items-container" class="space-y-3"></div>
            </div>

            <div class="p-6 bg-gray-900 border-t border-gray-700 space-y-3">
                <div class="flex justify-between text-sm"><span>Subtotal</span><span id="cart-subtotal" class="font-semibold">Rp 0</span></div>
                <div class="flex justify-between text-sm"><span>Pajak (10%) + Service Charge (5%)</span><span id="cart-tax" class="font-semibold">Rp 0</span></div>
                <div class="flex justify-between text-lg font-bold border-t border-gray-700 pt-2 text-amber-400"><span>Total Bayar</span><span id="cart-total">Rp 0</span></div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Metode Pembayaran</label>
                    <select id="payment-method" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                        <option value="bca_va">Virtual Account BCA (Midtrans)</option>
                        <option value="bni_va">Virtual Account BNI (Midtrans)</option>
                        <option value="bri_va">Virtual Account BRI (Midtrans)</option>
                        <option value="qris">QRIS Instant Payment</option>
                        <option value="cash">Bayar Tunai di Kasir</option>
                    </select>
                </div>
                <button onclick="processCheckout()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition">Konfirmasi Checkout & Bayar</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allMenus = [];
        let cart = [];

        function checkUserSession() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const role = localStorage.getItem('role');
            const container = document.getElementById('auth-btn-container');

            if (isLoggedIn === 'true' && container) {
                container.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <a href="/admin.html" class="bg-amber-600 hover:bg-amber-500 px-3 py-2 rounded-lg text-sm font-semibold transition text-white flex items-center shadow">
                            <i class="fa-solid fa-gauge-high mr-1.5"></i> Dashboard (${role})
                        </a>
                        <button onclick="handleClientLogout()" class="bg-red-600 hover:bg-red-500 px-2.5 py-2 rounded-lg text-sm font-semibold transition text-white" title="Keluar Sesi">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                `;
            }
        }

        function handleClientLogout() {
            if (confirm('Apakah Anda ingin keluar dari sesi admin/kasir ini?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('role');
                window.location.reload();
            }
        }

        checkUserSession();

        // Fungsi memuat 1 sampai 50 Meja secara dinamis
        async function fetchTablesForCustomer() {
            try {
                const res = await fetch(`${API_BASE}/tables`);
                const result = await res.json();
                
                const tableStatusMap = {};
                if (result.success && result.data) {
                    result.data.forEach(t => {
                        tableStatusMap[t.nomor_meja] = t.status;
                    });
                }

                const selectMeja = document.getElementById('select-meja');
                const resMeja = document.getElementById('res-meja');
                selectMeja.innerHTML = '';
                resMeja.innerHTML = '';
                
                for (let i = 1; i <= 50; i++) {
                    const status = tableStatusMap[i] || 'kosong';
                    const isTerisi = status === 'terisi';
                    const statusLabel = isTerisi ? '🔴 (TERISI)' : '🟢 (KOSONG)';
                    const kapasitas = i > 40 ? 8 : (i > 25 ? 6 : 4);

                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `Meja #${String(i).padStart(2, '0')} (${kapasitas} Orang) ${statusLabel}`;
                    if (isTerisi) {
                        option.disabled = true;
                        option.style.color = '#ef4444';
                    }
                    selectMeja.appendChild(option);

                    const resOption = document.createElement('option');
                    resOption.value = i;
                    resOption.textContent = `Meja #${String(i).padStart(2, '0')} (${kapasitas} Orang)`;
                    resMeja.appendChild(resOption);
                }
            } catch (err) {
                console.error("Gagal memuat status meja:", err);
            }
        }

        fetchTablesForCustomer();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('bg-amber-600', 'text-white');
                el.classList.add('text-gray-400');
            });
            document.getElementById(`tab-btn-${tabName}`).classList.add('bg-amber-600', 'text-white');

            if (tabName === 'queue') fetchQueue();
            if (tabName === 'reservation') fetchReservations();
        }

        async function fetchMenus() {
            try {
                const res = await fetch(`${API_BASE}/menu`);
                const result = await res.json();
                if (result.success) {
                    allMenus = result.data;
                    renderMenus(allMenus);
                    populateReviewDropdown(allMenus);
                }
            } catch (err) { console.error("Error menu:", err); }
        }

        function renderMenus(menus) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            menus.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden flex flex-col">
                        <div class="h-40 bg-gray-700 relative">
                            <img src="${item.gambar_url || 'https://via.placeholder.com/300'}" alt="${item.nama_menu}" class="w-full h-full object-cover">
                            <span class="absolute top-2 right-2 bg-black bg-opacity-70 text-amber-400 text-xs px-2 py-1 rounded-md font-bold">⭐ ${item.rating_avg}</span>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
                            <div>
                                <h3 class="font-bold text-lg mb-1">${item.nama_menu}</h3>
                                <p class="text-xs text-gray-400 line-clamp-2">${item.deskripsi}</p>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-amber-400 font-bold">Rp ${Number(item.harga).toLocaleString('id-ID')}</span>
                                    <span class="text-xs text-gray-400">Stok: ${item.stok}</span>
                                </div>
                                <button onclick="addToCart(${item.id})" class="w-full bg-gray-700 hover:bg-amber-600 text-white font-medium py-1.5 rounded-lg text-sm transition">+ Tambah Pesanan</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function populateReviewDropdown(menus) {
            const select = document.getElementById('review-menu-id');
            select.innerHTML = '';
            menus.forEach(m => {
                select.innerHTML += `<option value="${m.id}">${m.nama_menu}</option>`;
            });
        }

        function filterCategory(cat) {
            if (cat === 'all') renderMenus(allMenus);
            else renderMenus(allMenus.filter(m => m.kategori === cat));
        }

        function searchMenu() {
            const kw = document.getElementById('search-input').value.toLowerCase();
            renderMenus(allMenus.filter(m => m.nama_menu.toLowerCase().includes(kw)));
        }

        function addToCart(menuId) {
            const menuItem = allMenus.find(m => m.id === menuId);
            
            let defaultPref = {};
            if (menuItem.kategori === 'steak') {
                defaultPref = { doneness: 'Medium', sauce: 'Blackpepper Sauce' };
            } else if (menuItem.kategori === 'drinks') {
                defaultPref = { size: 'Regular Cup', sugar: 'Normal Sugar', ice: 'Normal Ice' };
            } else if (menuItem.kategori === 'rice_bowl') {
                defaultPref = { size: 'Regular Portion', spicy: 'Tidak Pedas' };
            } else if (menuItem.kategori === 'sides') {
                defaultPref = { extra: 'Tanpa Topping Tambahan' };
            } else if (menuItem.kategori === 'desserts') {
                defaultPref = { size: 'Regular Portion', sweet: 'Normal Sweet' };
            } else {
                defaultPref = { note: 'Standar' };
            }

            const exist = cart.find(c => c.menu_id === menuId);
            if (exist) {
                exist.jumlah += 1;
            } else {
                cart.push({
                    menu_id: menuItem.id,
                    nama_menu: menuItem.nama_menu,
                    kategori: menuItem.kategori,
                    harga: Number(menuItem.harga),
                    jumlah: 1,
                    preferensi: defaultPref
                });
            }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-badge').innerText = cart.reduce((a, b) => a + b.jumlah, 0);
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Keranjang masih kosong.</p>';
            }

            let subtotal = 0;
            cart.forEach((item, index) => {
                subtotal += item.harga * item.jumlah;

                let optionHtml = '';
                if (item.kategori === 'steak') {
                    optionHtml = `
                        <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                            <div>
                                <span class="text-gray-400">Kematangan:</span>
                                <select onchange="updateItemPref(${index}, 'doneness', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Medium Rare" ${item.preferensi.doneness==='Medium Rare'?'selected':''}>Medium Rare</option>
                                    <option value="Medium" ${item.preferensi.doneness==='Medium'?'selected':''}>Medium</option>
                                    <option value="Well Done" ${item.preferensi.doneness==='Well Done'?'selected':''}>Well Done</option>
                                </select>
                            </div>
                            <div>
                                <span class="text-gray-400">Saus:</span>
                                <select onchange="updateItemPref(${index}, 'sauce', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Blackpepper Sauce" ${item.preferensi.sauce==='Blackpepper Sauce'?'selected':''}>Blackpepper</option>
                                    <option value="Mushroom Sauce" ${item.preferensi.sauce==='Mushroom Sauce'?'selected':''}>Mushroom</option>
                                    <option value="BBQ Sauce" ${item.preferensi.sauce==='BBQ Sauce'?'selected':''}>BBQ Sauce</option>
                                </select>
                            </div>
                        </div>
                    `;
                } else if (item.kategori === 'drinks') {
                    optionHtml = `
                        <div class="grid grid-cols-3 gap-2 mt-2 text-xs">
                            <div>
                                <span class="text-gray-400">Ukuran Gelas:</span>
                                <select onchange="updateItemPref(${index}, 'size', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Regular Cup" ${item.preferensi.size==='Regular Cup'?'selected':''}>Regular</option>
                                    <option value="Large Cup (+Rp 5.000)" ${item.preferensi.size==='Large Cup (+Rp 5.000)'?'selected':''}>Large (Besar)</option>
                                </select>
                            </div>
                            <div>
                                <span class="text-gray-400">Sugar Level:</span>
                                <select onchange="updateItemPref(${index}, 'sugar', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Normal Sugar" ${item.preferensi.sugar==='Normal Sugar'?'selected':''}>Normal Sugar</option>
                                    <option value="Less Sugar" ${item.preferensi.sugar==='Less Sugar'?'selected':''}>Less Sugar</option>
                                    <option value="No Sugar" ${item.preferensi.sugar==='No Sugar'?'selected':''}>No Sugar</option>
                                </select>
                            </div>
                            <div>
                                <span class="text-gray-400">Ice Level:</span>
                                <select onchange="updateItemPref(${index}, 'ice', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Normal Ice" ${item.preferensi.ice==='Normal Ice'?'selected':''}>Normal Ice</option>
                                    <option value="Less Ice" ${item.preferensi.ice==='Less Ice'?'selected':''}>Less Ice</option>
                                    <option value="No Ice" ${item.preferensi.ice==='No Ice'?'selected':''}>No Ice</option>
                                </select>
                            </div>
                        </div>
                    `;
                } else if (item.kategori === 'rice_bowl') {
                    optionHtml = `
                        <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                            <div>
                                <span class="text-gray-400">Ukuran Porsi:</span>
                                <select onchange="updateItemPref(${index}, 'size', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Regular Portion" ${item.preferensi.size==='Regular Portion'?'selected':''}>Regular</option>
                                    <option value="Large Portion" ${item.preferensi.size==='Large Portion'?'selected':''}>Large (Jumbo)</option>
                                </select>
                            </div>
                            <div>
                                <span class="text-gray-400">Level Pedas:</span>
                                <select onchange="updateItemPref(${index}, 'spicy', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Tidak Pedas" ${item.preferensi.spicy==='Tidak Pedas'?'selected':''}>Tidak Pedas</option>
                                    <option value="Sedang" ${item.preferensi.spicy==='Sedang'?'selected':''}>Sedang</option>
                                    <option value="Pedas Banget" ${item.preferensi.spicy==='Pedas Banget'?'selected':''}>Pedas Banget 🔥</option>
                                </select>
                            </div>
                        </div>
                    `;
                } else if (item.kategori === 'sides') {
                    optionHtml = `
                        <div class="mt-2 text-xs">
                            <span class="text-gray-400">Tambahan Topping / Extra:</span>
                            <select onchange="updateItemPref(${index}, 'extra', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                <option value="Tanpa Topping Tambahan" ${item.preferensi.extra==='Tanpa Topping Tambahan'?'selected':''}>Standar</option>
                                <option value="Extra Melted Cheese (+Rp 6.000)" ${item.preferensi.extra==='Extra Melted Cheese (+Rp 6.000)'?'selected':''}>Extra Melted Cheese</option>
                                <option value="Extra Crispy Garlic" ${item.preferensi.extra==='Extra Crispy Garlic'?'selected':''}>Extra Crispy Garlic</option>
                            </select>
                        </div>
                    `;
                } else if (item.kategori === 'desserts') {
                    optionHtml = `
                        <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                            <div>
                                <span class="text-gray-400">Ukuran Porsi:</span>
                                <select onchange="updateItemPref(${index}, 'size', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Regular Portion" ${item.preferensi.size==='Regular Portion'?'selected':''}>Regular</option>
                                    <option value="Extra Large" ${item.preferensi.size==='Extra Large'?'selected':''}>Extra Large</option>
                                </select>
                            </div>
                            <div>
                                <span class="text-gray-400">Tingkat Manis:</span>
                                <select onchange="updateItemPref(${index}, 'sweet', this.value)" class="w-full bg-gray-800 border border-gray-600 rounded p-1 text-white">
                                    <option value="Normal Sweet" ${item.preferensi.sweet==='Normal Sweet'?'selected':''}>Normal Sweet</option>
                                    <option value="Less Sweet" ${item.preferensi.sweet==='Less Sweet'?'selected':''}>Less Sweet</option>
                                </select>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-2">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm">${item.nama_menu}</h4>
                                <p class="text-xs text-amber-400">Rp ${item.harga.toLocaleString('id-ID')} x ${item.jumlah}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="changeQuantity(${index}, -1)" class="bg-gray-700 px-2 py-0.5 rounded text-xs font-bold">-</button>
                                <span class="text-sm font-bold">${item.jumlah}</span>
                                <button onclick="changeQuantity(${index}, 1)" class="bg-gray-700 px-2 py-0.5 rounded text-xs font-bold">+</button>
                            </div>
                        </div>
                        ${optionHtml}
                    </div>
                `;
            });

            const tax = subtotal * 0.15;
            document.getElementById('cart-subtotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
            document.getElementById('cart-tax').innerText = `Rp ${tax.toLocaleString('id-ID')}`;
            document.getElementById('cart-total').innerText = `Rp ${(subtotal + tax).toLocaleString('id-ID')}`;
        }

        function updateItemPref(index, key, value) {
            cart[index].preferensi[key] = value;
        }

        function changeQuantity(index, delta) {
            cart[index].jumlah += delta;
            if (cart[index].jumlah <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function toggleCartModal() { document.getElementById('cart-modal').classList.toggle('hidden'); }

        function generatePaymentCode(method) {
            if (method.includes('va')) {
                const bankPrefix = method.split('_')[0].toUpperCase();
                const randomDigits = Math.floor(10000000000 + Math.random() * 90000000000);
                return `VA-${bankPrefix}-${randomDigits}`;
            } else if (method === 'qris') {
                return '00020101021126690014ID.CO.QRIS.MERCHANT' + Math.floor(1000000000000 + Math.random() * 9000000000000);
            }
            return 'TUNAI-KASIR';
        }

        async function processCheckout() {
            if (cart.length === 0) return alert('Keranjang kosong!');
            const meja = document.getElementById('select-meja').value;
            const method = document.getElementById('payment-method').value;
            const paymentCode = generatePaymentCode(method);

            const itemsFormatted = cart.map(item => {
                let prefText = Object.entries(item.preferensi).map(([k, v]) => `${k}: ${v}`).join(', ');
                return { ...item, catatan_preferensi: prefText };
            });

            const res = await fetch(`${API_BASE}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    nomor_meja: Number(meja), 
                    nama_pelanggan: `Pelanggan Meja ${meja}`, 
                    metode_pembayaran: method, 
                    items: itemsFormatted 
                })
            });
            const result = await res.json();
            if (result.success) {
                alert(`Checkout Sukses!\nMeja #${meja} kini berstatus Terisi.\nKode Pembayaran / VA: ${paymentCode}`);
                cart = []; 
                updateCartUI(); 
                toggleCartModal(); 
                fetchMenus();
                fetchTablesForCustomer();
            } else alert(`Gagal: ${result.message}`);
        }

        async function fetchQueue() {
            const res = await fetch(`${API_BASE}/queue`);
            const result = await res.json();
            const container = document.getElementById('queue-list-container');
            container.innerHTML = '';
            if (result.data.length === 0) container.innerHTML = '<p class="text-sm text-gray-500">Tidak ada antrean aktif saat ini.</p>';
            result.data.forEach(q => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-900 p-3.5 rounded-lg border border-gray-700">
                        <div>
                            <span class="text-amber-400 font-bold text-lg mr-2">${q.nomor_antrean}</span>
                            <span class="font-semibold text-sm">${q.nama_pelanggan} (${q.jumlah_orang} Orang)</span>
                        </div>
                        <span class="text-xs bg-amber-600/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded font-bold uppercase">${q.status}</span>
                    </div>
                `;
            });
        }

        async function submitQueue() {
            const nama = document.getElementById('queue-nama').value;
            const jumlah = document.getElementById('queue-jumlah').value;
            const hp = document.getElementById('queue-hp').value;
            if (!nama) return alert('Isi nama pelanggan!');

            const res = await fetch(`${API_BASE}/queue`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama_pelanggan: nama, jumlah_orang: Number(jumlah), nomor_telepon: hp })
            });
            const result = await res.json();
            if (result.success) {
                alert(`Nomor Antrean Anda: ${result.data.nomor_antrean}`);
                document.getElementById('queue-nama').value = '';
                fetchQueue();
            }
        }

        async function fetchReservations() {
            try {
                const res = await fetch(`${API_BASE}/reservations`);
                const result = await res.json();
                const container = document.getElementById('reservation-list-container');
                container.innerHTML = '';

                if (!result.data || result.data.length === 0) {
                    container.innerHTML = '<p class="text-sm text-gray-500">Belum ada jadwal reservasi aktif.</p>';
                    return;
                }

                result.data.forEach(r => {
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-900 p-3.5 rounded-lg border border-gray-700">
                            <div>
                                <span class="text-amber-400 font-bold text-base mr-2">Meja #${r.nomor_meja}</span>
                                <span class="font-semibold text-sm">${r.nama_pemesan} (${r.jumlah_tamu} Tamu)</span>
                                <p class="text-xs text-gray-400 mt-1"><i class="fa-regular fa-calendar mr-1"></i> ${r.tanggal_reservasi.split('T')[0]} | <i class="fa-regular fa-clock mr-1"></i> ${r.jam_reservasi}</p>
                            </div>
                            <span class="text-xs bg-green-600/20 text-green-400 border border-green-500/30 px-2 py-1 rounded font-bold uppercase">Aktif</span>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Gagal memuat reservasi:", err);
            }
        }

        async function submitReservation() {
            const meja = document.getElementById('res-meja').value;
            const nama = document.getElementById('res-nama').value;
            const hp = document.getElementById('res-hp').value;
            const tanggal = document.getElementById('res-tanggal').value;
            const jam = document.getElementById('res-jam').value;
            const tamu = document.getElementById('res-tamu').value;

            if (!nama || !tanggal || !jam) {
                alert('Mohon isi nama, tanggal, dan jam reservasi dengan lengkap!');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/reservations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nomor_meja: Number(meja),
                        nama_pemesan: nama,
                        nomor_telepon: hp,
                        tanggal_reservasi: tanggal,
                        jam_reservasi: jam,
                        jumlah_tamu: Number(tamu)
                    })
                });
                const result = await res.json();
                if (result.success) {
                    alert('Reservasi meja berhasil dibuat!');
                    document.getElementById('res-nama').value = '';
                    document.getElementById('res-hp').value = '';
                    fetchReservations();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan.');
            }
        }

        async function submitReview() {
            const menuId = document.getElementById('review-menu-id').value;
            const nama = document.getElementById('review-nama').value;
            const rating = document.getElementById('review-rating').value;
            const komentar = document.getElementById('review-komentar').value;

            if (!nama || !komentar) return alert('Lengkapi nama dan ulasan!');

            const res = await fetch(`${API_BASE}/reviews`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ menu_id: Number(menuId), nama_pelanggan: nama, rating: Number(rating), komentar })
            });
            const result = await res.json();
            if (result.success) {
                alert('Terima kasih atas ulasan bintang Anda!');
                document.getElementById('review-nama').value = '';
                document.getElementById('review-komentar').value = '';
                fetchMenus();
                switchTab('menu');
            }
        }

        fetchMenus();
    </script>
</body>
</html>
